[package]
name = "libriscv-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "BSD-3-Clause"

[package.metadata]
cargo-fuzz = true

[features]
default = ["compressed"]
# The C extension (libriscv's `ext-c`). Without it (`--no-default-features`)
# the decoder uses its 4-byte layout, which CI also tests.
compressed = ["libriscv/ext-c"]
# Run the targets with the Cranelift JIT (`MachineOptions::jit`), and build
# `jitdifffuzzer`.
jit = ["libriscv/jit"]

[dependencies]
libfuzzer-sys = "0.4"
# libriscv's defaults except ext-c, which is the `compressed` feature here.
libriscv = { path = "../crates/libriscv", default-features = false, features = ["ext-a", "ext-f", "ext-v"] }

# Not part of the main workspace: cargo-fuzz needs nightly sanitizer flags
# and libFuzzer, which `cargo test` shouldn't build.
[workspace]
members = ["."]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"

[profile.release]
debug = 1

[[bin]]
name = "vmfuzzer"
path = "fuzz_targets/vmfuzzer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "elffuzzer"
path = "fuzz_targets/elffuzzer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "syshelperfuzzer"
path = "fuzz_targets/syshelperfuzzer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "nativefuzzer"
path = "fuzz_targets/nativefuzzer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "linuxfuzzer"
path = "fuzz_targets/linuxfuzzer.rs"
test = false
