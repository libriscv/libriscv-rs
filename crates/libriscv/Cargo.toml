[package]
name = "libriscv"
description = "Safe-Rust port of libriscv, a fast RISC-V userspace emulator for sandboxing and scripting"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# RV64 only: the port does not support RV32 or RV128. The JIT is on by
# default; `default-features = false` (plus the extensions) leaves it and
# its dependencies (Cranelift, `libriscv-jit-rt`) out.
default = ["ext-a", "ext-c", "ext-f", "ext-v", "jit"]
ext-a = []
ext-c = []
ext-f = []
# The vector extension (RVV 1.0, Zvbb, Zvfhmin); its conversions need F.
ext-v = ["ext-f"]
# The fastest interpreter dispatch: guaranteed tail calls (`become`), the
# `preserve_none` calling convention and aligned handlers. Needs the nightly
# pinned in `fuzz/rust-toolchain.toml` (`cargo +nightly-2026-09-28`). Without it the crate builds on stable Rust,
# with the same handlers chained by ordinary tail calls. See "Dispatch" in
# PORTING.md.
nightly-dispatch = []
# Software FCSR rounding-mode/flags emulation (C++: RISCV_FCSR). Not ported
# yet (C++ needs long double for it): enabling it is a compile error.
fcsr = []
# A system call table of 601 entries instead of 512 (C++:
# RISCV_SYSCALLS_MAX=601): system calls 0..=599 and EBREAK at 600
# (`SYSCALL_EBREAK_NR`), for embedders numbering their own calls up to 599.
syscalls-600 = []
# Extra runtime checks (C++: RISCV_DEBUG).
debug-checks = []
# Cranelift JIT (the counterpart of C++'s asmjit backend). Compiled code is
# placed in executable memory and entered by `libriscv-jit-rt`, the only crate
# with unsafe code; this crate stays `forbid(unsafe_code)` either way. See
# "JIT" in PORTING.md. Also shared read-only memory between machines
# (`MachineOptions::use_shared_rodata`): the arena becomes a mapping owned by
# `libriscv-jit-rt`, see "Shared read-only data" in PORTING.md.
jit = [
    "dep:cranelift-codegen",
    "dep:cranelift-frontend",
    "dep:cranelift-native",
    "dep:libriscv-jit-rt",
]
# Ahead-of-time translation to safe Rust (the counterpart of C++'s binary
# translation to C): `libriscv::aot`. No dependencies and no unsafe code;
# translations compiled into the program are registered with
# `aot::register`. See "AOT" in PORTING.md. The generated Rust uses `become`,
# so it needs the pinned nightly too, like `nightly-dispatch`.
aot = ["nightly-dispatch"]
# Loading translations compiled into shared objects
# (`aot::load_shared_object`), through `libriscv-jit-rt`.
aot-dylib = ["aot", "dep:libriscv-jit-rt"]

[dependencies]
cranelift-codegen = { version = "0.137.1", optional = true }
cranelift-frontend = { version = "0.137.1", optional = true }
cranelift-native = { version = "0.137.1", optional = true }
libriscv-jit-rt = { workspace = true, optional = true }

[dev-dependencies]
testutil.workspace = true

[lints]
workspace = true

[[bench]]
name = "fork"
harness = false

[[bench]]
name = "vmcall"
harness = false

[[bench]]
name = "scaling"
harness = false
