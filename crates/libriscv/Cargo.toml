[package]
name = "libriscv"
description = "Safe-Rust port of libriscv, a fast RISC-V userspace emulator for sandboxing and scripting"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# RV64 only: the port does not support RV32 or RV128.
default = ["ext-a", "ext-c", "ext-f", "ext-v"]
ext-a = []
ext-c = []
ext-f = []
ext-v = []
# Software FCSR rounding-mode/flags emulation (C++: RISCV_FCSR). Not ported
# yet (C++ needs long double for it): enabling it is a compile error.
fcsr = []
# Extra runtime checks (C++: RISCV_DEBUG).
debug-checks = []
# Cranelift JIT (the counterpart of C++'s asmjit backend). Compiled code is
# placed in executable memory and entered by `libriscv-jit-rt`, the only crate
# with unsafe code; this crate stays `forbid(unsafe_code)` either way. See
# "JIT" in PORTING.md.
jit = [
    "dep:cranelift-codegen",
    "dep:cranelift-frontend",
    "dep:cranelift-native",
    "dep:libriscv-jit-rt",
]

[dependencies]
cranelift-codegen = { version = "0.137.1", optional = true }
cranelift-frontend = { version = "0.137.1", optional = true }
cranelift-native = { version = "0.137.1", optional = true }
libriscv-jit-rt = { workspace = true, optional = true }

[dev-dependencies]
testutil.workspace = true

[lints]
workspace = true

[[bench]]
name = "fork"
harness = false
