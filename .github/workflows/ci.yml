name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # C++ libriscv commit used as the differential-testing oracle, with
  # scripts/cpp-reference-patches/*.patch applied. Keep in sync with
  # PORTING.md.
  LIBRISCV_CPP_REF: cafba3e8c29feb76a7fdd9a553f3b25014001d6e
  # eembc/coremark commit for the CoreMark difftest and benchmark.
  COREMARK_REF: eefc986ebd3452d6adde22eafaff3e5c859f29e4
  # The pinned nightly for the opt-in `nightly-dispatch` and `aot` features;
  # everything else builds on the stable pinned in rust-toolchain.toml.
  # Keep in sync with fuzz/rust-toolchain.toml.
  NIGHTLY: nightly-2026-09-28

jobs:
  lint:
    strategy:
      fail-fast: false
      matrix:
        # The JIT's instruction-cache maintenance and the code cache's ELF
        # writer have AArch64-only code.
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchains (rust-toolchain.toml, and the nightly)
        run: |
          rustup toolchain install
          rustup toolchain install "$NIGHTLY" --profile minimal -c clippy
      - run: cargo fmt --all --check
        if: matrix.os == 'ubuntu-24.04'
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --no-default-features -- -D warnings
      - run: cargo +$NIGHTLY clippy --all-targets --features libriscv/nightly-dispatch -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        # x86-64 and AArch64 hosts: the JIT runs on both, and the C++
        # reference is built natively on each.
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchains (rust-toolchain.toml, and the nightly)
        run: |
          rustup toolchain install
          rustup toolchain install "$NIGHTLY" --profile minimal -t riscv64gc-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2

      - name: Install RISC-V cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14-riscv64-linux-gnu g++-14-riscv64-linux-gnu cmake ninja-build

      - name: Cache C++ reference emulator
        id: cache-ref
        uses: actions/cache@v4
        with:
          path: libriscv-cpp/emulator/.build/rvlinux
          key: rvlinux-${{ runner.arch }}-${{ env.LIBRISCV_CPP_REF }}-${{ hashFiles('scripts/cpp-reference-patches/*.patch') }}

      - name: Fetch C++ libriscv
        run: |
          git init libriscv-cpp
          git -C libriscv-cpp fetch --depth 1 https://github.com/libriscv/libriscv.git "$LIBRISCV_CPP_REF"
          git -C libriscv-cpp checkout FETCH_HEAD
          for patch in scripts/cpp-reference-patches/*.patch; do
            git -C libriscv-cpp apply "$PWD/$patch"
          done

      - name: Fetch CoreMark
        run: |
          git init coremark
          git -C coremark fetch --depth 1 https://github.com/eembc/coremark.git "$COREMARK_REF"
          git -C coremark checkout FETCH_HEAD

      - name: Build C++ reference emulator
        if: steps.cache-ref.outputs.cache-hit != 'true'
        run: |
          cmake -S libriscv-cpp/emulator -B libriscv-cpp/emulator/.build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DRISCV_BINARY_TRANSLATION=OFF
          cmake --build libriscv-cpp/emulator/.build --target rvlinux

      - name: Test (with the JIT, the default; difftests also run --jit)
        env:
          LIBRISCV_CPP: ${{ github.workspace }}/libriscv-cpp
          LIBRISCV_CPP_EMULATOR: ${{ github.workspace }}/libriscv-cpp/emulator/.build/rvlinux
          COREMARK_DIR: ${{ github.workspace }}/coremark
          LIBRISCV_REQUIRE_TOOLCHAIN: "1"
        run: cargo test --workspace

      - name: Test without the C extension (4-byte decoder layout)
        env:
          LIBRISCV_CPP: ${{ github.workspace }}/libriscv-cpp
          LIBRISCV_CPP_EMULATOR: ${{ github.workspace }}/libriscv-cpp/emulator/.build/rvlinux
          COREMARK_DIR: ${{ github.workspace }}/coremark
          LIBRISCV_REQUIRE_TOOLCHAIN: "1"
        run: cargo test -p libriscv --no-default-features

      - name: Test without the JIT (interpreter only)
        env:
          LIBRISCV_CPP: ${{ github.workspace }}/libriscv-cpp
          LIBRISCV_CPP_EMULATOR: ${{ github.workspace }}/libriscv-cpp/emulator/.build/rvlinux
          COREMARK_DIR: ${{ github.workspace }}/coremark
          LIBRISCV_REQUIRE_TOOLCHAIN: "1"
        run: cargo test --workspace --no-default-features

      - name: Test the JIT without the C extension
        run: cargo test -p libriscv --no-default-features --features jit

      - name: Test the 601-entry system call table
        env:
          LIBRISCV_REQUIRE_TOOLCHAIN: "1"
        run: cargo test -p libriscv --features syscalls-600 --test basic --test dispatch --test libc_fastpath

      # The default dispatch relies on LLVM turning handler calls into
      # jumps; optimized, they must not grow the stack.
      - name: Check the stable dispatch's tail calls (release)
        run: cargo test --release -p libriscv --test dispatch

      - name: Test the opt-in nightly dispatch (become, preserve_none)
        env:
          LIBRISCV_CPP: ${{ github.workspace }}/libriscv-cpp
          LIBRISCV_CPP_EMULATOR: ${{ github.workspace }}/libriscv-cpp/emulator/.build/rvlinux
          COREMARK_DIR: ${{ github.workspace }}/coremark
          LIBRISCV_REQUIRE_TOOLCHAIN: "1"
        run: cargo +$NIGHTLY test --workspace --features libriscv/nightly-dispatch,rvlinux/nightly-dispatch

  # Run the dynamically linked STREAM benchmark through ld.so and the
  # riscv64 glibc, and check that it completes with validated results:
  # interpreted, with the JIT (cold cache), and with the JIT again, which
  # must use the cached code of ld.so and libc.
  stream:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2

      - name: Install riscv64 glibc (ld.so and shared libraries)
        run: |
          sudo apt-get update
          sudo apt-get install -y libc6-riscv64-cross

      - run: cargo build --release -p rvlinux --features jit

      - name: Run STREAM
        shell: bash
        run: |
          set -euo pipefail
          # The guest's ld.so opens the program itself, so the path must be absolute.
          prog="$PWD/binaries/STREAM/stream.dyn"
          cache="$RUNNER_TEMP/rvlinux-jit-cache"
          rm -rf "$cache"

          # run NAME [rvlinux args...]: run STREAM, check it, set $ms.
          run() {
            local name=$1; shift
            echo "::group::$name"
            local start=$(date +%s%N)
            ./target/release/rvlinux "$@" "$prog" > "$name.out" 2> "$name.err"
            ms=$(( ($(date +%s%N) - start) / 1000000 ))
            cat "$name.out" "$name.err"
            echo "::endgroup::"
            echo "$name: ${ms} ms"
            grep -q '^Triad:' "$name.out"
            grep -q '^Solution Validates' "$name.out"
            grep -q '^>>> Program exited, exit code = 0 ' "$name.out"
          }

          run interpreter -n

          run jit-cold -j --jit-cache-dir "$cache"
          cold_ms=$ms
          if [ -z "$(ls -A "$cache")" ]; then
            echo "::error::The JIT cache is empty after the first --jit run"; exit 1
          fi

          run jit-cached -j --jit-cache-dir "$cache"
          if grep -q 'Saving JIT code' jit-cached.err; then
            echo "::error::The second --jit run compiled system code again"; exit 1
          fi
          # Cold, the run waits for ld.so and libc to compile and be saved.
          if [ $(( ms * 2 )) -ge "$cold_ms" ]; then
            echo "::error::Cached --jit run (${ms} ms) is not faster than the cold one (${cold_ms} ms)"; exit 1
          fi

  # Build rvlinux on FreeBSD and run the dynamic STREAM executable there:
  # interpreted, with the JIT, and with the JIT again. Loading cached JIT
  # code is Linux-only, so the second --jit run must ignore the files the
  # first one saved and compile everything again.
  freebsd:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # FreeBSD has no riscv64 glibc package: take Ubuntu's, extracted into
      # the workspace that is copied into the VM.
      - name: Fetch riscv64 glibc (ld.so and shared libraries)
        run: |
          sudo apt-get update
          apt-get download libc6-riscv64-cross
          dpkg-deb -x libc6-riscv64-cross_*.deb riscv64-glibc
          rm libc6-riscv64-cross_*.deb

      - name: Build and run STREAM on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.3"
          usesh: true
          copyback: false
          prepare: pkg install -y curl
          run: |
            set -eu
            cp -R riscv64-glibc/usr/riscv64-linux-gnu /usr/

            # The pinned stable toolchain, without the rustfmt/clippy
            # components of rust-toolchain.toml (not needed here).
            channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain "$channel"
            export PATH="$HOME/.cargo/bin:$PATH" RUSTUP_TOOLCHAIN="$channel"
            cargo build --release -p rvlinux --features jit

            # The guest's ld.so opens the program itself, so the path must be absolute.
            prog="$PWD/binaries/STREAM/stream.dyn"
            cache=$(mktemp -d)
            run() {
              name=$1; shift
              echo "=== $name"
              ./target/release/rvlinux "$@" "$prog" > "$name.out"
              cat "$name.out"
              grep -q '^Triad:' "$name.out"
              grep -q '^Solution Validates' "$name.out"
              grep -q '^>>> Program exited, exit code = 0 ' "$name.out"
            }
            run interpreter -n
            run jit -j --jit-cache-dir "$cache"
            run jit-again -j --jit-cache-dir "$cache"

  # macOS on Apple Silicon: lint and test there, the JIT included. macOS
  # traps reads of CTR_EL0, so the JIT flushes the instruction cache through
  # libSystem. There is no riscv64 Linux cross compiler or C++ reference
  # emulator here, so the tests that need them skip; shared objects of cached
  # JIT code are Linux-only and their tests are compiled out.
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2

      # Sources only: native.rs reads the C++ unit tests' headers.
      - name: Fetch C++ libriscv
        run: |
          git init libriscv-cpp
          git -C libriscv-cpp fetch --depth 1 https://github.com/libriscv/libriscv.git "$LIBRISCV_CPP_REF"
          git -C libriscv-cpp checkout FETCH_HEAD

      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --no-default-features -- -D warnings

      - name: Test (with the JIT, the default)
        env:
          LIBRISCV_CPP: ${{ github.workspace }}/libriscv-cpp
        run: cargo test --workspace

      - name: Test without the JIT (interpreter only)
        env:
          LIBRISCV_CPP: ${{ github.workspace }}/libriscv-cpp
        run: cargo test --workspace --no-default-features

      - name: Check the stable dispatch's tail calls (release)
        run: cargo test --release -p libriscv --test dispatch

  features:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - run: cargo build -p libriscv --no-default-features
      # Everything except `fcsr`, which is a deliberate compile error until
      # it is ported.
      - run: cargo build -p libriscv --features ext-a,ext-c,ext-f,ext-v,debug-checks,syscalls-600,jit
      # The opt-in nightly features: AOT (which enables `nightly-dispatch`).
      - run: rustup toolchain install "$NIGHTLY" --profile minimal
      - run: cargo +$NIGHTLY build -p libriscv --features ext-a,ext-c,ext-f,ext-v,jit,aot-dylib
