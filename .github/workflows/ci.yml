name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # C++ libriscv commit used as the differential-testing oracle.
  # Keep in sync with PORTING.md.
  LIBRISCV_CPP_REF: e806d46046fb4059ab6e605255852b9335386de2
  # eembc/coremark commit for the CoreMark difftest and benchmark.
  COREMARK_REF: eefc986ebd3452d6adde22eafaff3e5c859f29e4

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --features libriscv/jit,rvlinux/jit -- -D warnings

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2

      - name: Install RISC-V cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14-riscv64-linux-gnu g++-14-riscv64-linux-gnu cmake ninja-build

      - name: Cache C++ reference emulator
        id: cache-ref
        uses: actions/cache@v4
        with:
          path: libriscv-cpp/emulator/.build/rvlinux
          key: rvlinux-${{ env.LIBRISCV_CPP_REF }}

      - name: Fetch C++ libriscv
        run: |
          git init libriscv-cpp
          git -C libriscv-cpp fetch --depth 1 https://github.com/libriscv/libriscv.git "$LIBRISCV_CPP_REF"
          git -C libriscv-cpp checkout FETCH_HEAD

      - name: Fetch CoreMark
        run: |
          git init coremark
          git -C coremark fetch --depth 1 https://github.com/eembc/coremark.git "$COREMARK_REF"
          git -C coremark checkout FETCH_HEAD

      - name: Build C++ reference emulator
        if: steps.cache-ref.outputs.cache-hit != 'true'
        run: |
          cmake -S libriscv-cpp/emulator -B libriscv-cpp/emulator/.build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DRISCV_BINARY_TRANSLATION=OFF
          cmake --build libriscv-cpp/emulator/.build --target rvlinux

      - name: Test
        env:
          LIBRISCV_CPP: ${{ github.workspace }}/libriscv-cpp
          LIBRISCV_CPP_EMULATOR: ${{ github.workspace }}/libriscv-cpp/emulator/.build/rvlinux
          COREMARK_DIR: ${{ github.workspace }}/coremark
          LIBRISCV_REQUIRE_TOOLCHAIN: "1"
        run: cargo test --workspace

      - name: Test without the C extension (4-byte decoder layout)
        env:
          LIBRISCV_CPP: ${{ github.workspace }}/libriscv-cpp
          LIBRISCV_CPP_EMULATOR: ${{ github.workspace }}/libriscv-cpp/emulator/.build/rvlinux
          COREMARK_DIR: ${{ github.workspace }}/coremark
          LIBRISCV_REQUIRE_TOOLCHAIN: "1"
        run: cargo test -p libriscv --no-default-features

      - name: Test with the JIT (difftests also run --jit)
        env:
          LIBRISCV_CPP: ${{ github.workspace }}/libriscv-cpp
          LIBRISCV_CPP_EMULATOR: ${{ github.workspace }}/libriscv-cpp/emulator/.build/rvlinux
          COREMARK_DIR: ${{ github.workspace }}/coremark
          LIBRISCV_REQUIRE_TOOLCHAIN: "1"
        run: cargo test --workspace --features libriscv/jit,rvlinux/jit

      - name: Test the JIT without the C extension
        run: cargo test -p libriscv --no-default-features --features jit

  # Run the dynamically linked STREAM benchmark through ld.so and the
  # riscv64 glibc, and check that it completes with validated results:
  # interpreted, with the JIT (cold cache), and with the JIT again, which
  # must use the cached code of ld.so and libc.
  stream:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2

      - name: Install riscv64 glibc (ld.so and shared libraries)
        run: |
          sudo apt-get update
          sudo apt-get install -y libc6-riscv64-cross

      - run: cargo build --release -p rvlinux --features jit

      - name: Run STREAM
        shell: bash
        run: |
          set -euo pipefail
          # The guest's ld.so opens the program itself, so the path must be absolute.
          prog="$PWD/binaries/STREAM/stream.dyn"
          cache="$RUNNER_TEMP/rvlinux-jit-cache"
          rm -rf "$cache"

          # run NAME [rvlinux args...]: run STREAM, check it, set $ms.
          run() {
            local name=$1; shift
            echo "::group::$name"
            local start=$(date +%s%N)
            ./target/release/rvlinux "$@" "$prog" > "$name.out" 2> "$name.err"
            ms=$(( ($(date +%s%N) - start) / 1000000 ))
            cat "$name.out" "$name.err"
            echo "::endgroup::"
            echo "$name: ${ms} ms"
            grep -q '^Triad:' "$name.out"
            grep -q '^Solution Validates' "$name.out"
            grep -q '^>>> Program exited, exit code = 0 ' "$name.out"
          }

          run interpreter

          run jit-cold -j --jit-cache-dir "$cache"
          cold_ms=$ms
          if [ -z "$(ls -A "$cache")" ]; then
            echo "::error::The JIT cache is empty after the first --jit run"; exit 1
          fi

          run jit-cached -j --jit-cache-dir "$cache"
          if grep -q 'Saving JIT code' jit-cached.err; then
            echo "::error::The second --jit run compiled system code again"; exit 1
          fi
          # Cold, the run waits for ld.so and libc to compile and be saved.
          if [ $(( ms * 2 )) -ge "$cold_ms" ]; then
            echo "::error::Cached --jit run (${ms} ms) is not faster than the cold one (${cold_ms} ms)"; exit 1
          fi

  features:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - run: cargo build -p libriscv --no-default-features
      # Everything except `fcsr`, which is a deliberate compile error until
      # it's ported.
      - run: cargo build -p libriscv --features ext-a,ext-c,ext-f,ext-v,debug-checks,jit
